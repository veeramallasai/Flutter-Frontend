server:
  port: ${PORT:${SERVER_PORT:8085}}
  shutdown: graceful

spring:
  application:
    name: farm-to-home-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5434}/${DB_NAME:farm_to_home}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${PGUSER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:root}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:veeramallasaipichaiah456@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
            trust: ${MAIL_SSL_TRUST:smtp.gmail.com}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors-origins: "${CORS_ORIGINS:https://flutter-frontend-production-1590.up.railway.app,http://localhost:8080}"
  mail-from: ${MAIL_FROM:veeramallasaipichaiah456@gmail.com}
  auth:
    google-client-ids: ${GOOGLE_CLIENT_IDS:629064242041-e9cl3id38mtasb9asii6qlmdu08t1fri.apps.googleusercontent.com}
    apple-client-ids: ${APPLE_CLIENT_IDS:com.example.farmToHomeApp}
  jwt:
    issuer: ${JWT_ISSUER:farm-to-home-api}
    secret: ${JWT_SECRET:local-development-secret-change-before-production-32chars}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
